services:
  web:
    build: .
    ports:
      - "8090:80"
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"   # host port changed to 3307
    volumes:
      - db_data:/var/lib/mysql   # persist DB data

volumes:
  db_data:

